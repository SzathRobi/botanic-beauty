name: botanic-beauty-local

services:
  mongodb:
    image: mongo:8.0
    container_name: botanic-beauty-mongodb
    command: ['mongod', '--replSet', 'botanic-beauty-rs', '--bind_ip_all']
    ports:
      - '127.0.0.1:27018:27017'
    volumes:
      - mongodb-data:/data/db
      - mongodb-config:/data/configdb
      - ./docker/mongodb/healthcheck.js:/usr/local/bin/local-healthcheck.js:ro
    healthcheck:
      test:
        [
          'CMD',
          'mongosh',
          '--quiet',
          '--file',
          '/usr/local/bin/local-healthcheck.js',
        ]
      interval: 5s
      timeout: 5s
      start_period: 15s
      retries: 12
    restart: unless-stopped

volumes:
  mongodb-data:
  mongodb-config:
